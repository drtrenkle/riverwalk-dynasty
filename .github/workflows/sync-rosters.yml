name: Sync ESPN rosters

on:
  schedule:
    # 13:00 UTC daily (~6am/9am US time depending on season) — plenty
    # often enough for a weekly-moving fantasy roster.
    - cron: '0 13 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync script
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/sync-rosters.mjs

      - name: Commit updated roster data
        run: |
          git config user.name "riverwalk-dynasty-bot"
          git config user.email "actions@github.com"
          git add data/rosters.json
          git diff --cached --quiet && echo "No roster changes." || git commit -m "Sync rosters from ESPN"
          git push
